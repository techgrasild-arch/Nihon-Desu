<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Nihon-Desu</title>
    <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: 'Arial', sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 40px 0;
      }

      .login-container {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
          background-color: white;
          gap: 40px;
      }

      .login-form {
          background: #ffffff;
          padding: 40px;
          border-radius: 14px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
          width: 100%;
          max-width: 440px;
          text-align: center;
          animation: nd-fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }

      h2 {
          font-size: 24px;
          margin-bottom: 24px;
          color: #161616;
      }

      .input-group {
          margin-bottom: 16px;
          text-align: left;
      }

      .input-group label {
          font-size: 13.5px;
          color: #555;
          display: block;
          margin-bottom: 5px;
          font-weight: 500;
      }

      .input-group input {
          width: 100%;
          padding: 10px 12px;
          border: 1.5px solid #ddd;
          border-radius: 6px;
          font-size: 15px;
          background-color: #f9f9f9;
          transition: all 0.2s ease;
      }

      .input-group input:focus {
          border-color: #e4032c;
          outline: none;
          background: #fff;
          box-shadow: 0 0 0 3px rgba(228, 3, 44, 0.1);
      }

      button.btn {
          width: 100%;
          padding: 12px;
          background: #161616;
          border: none;
          border-radius: 6px;
          color: white;
          font-size: 15.5px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s ease;
      }

      button.btn:hover {
          background: #e4032c;
      }

      .form-message {
          margin-bottom: 14px;
          padding: 10px 12px;
          border-radius: 6px;
          font-size: 13.5px;
          text-align: left;
          display: none;
      }

      .form-message.nd-show {
          display: block;
      }

      .form-message.nd-error {
          background: #fdeaea;
          color: #b8021f;
          border: 1px solid #f6c7c7;
      }

      .form-message.nd-success {
          background: #eafaf0;
          color: #1a7a3c;
          border: 1px solid #b8ecc9;
      }

      .forgot-password {
          margin-top: 16px;
          font-size: 13.5px;
          color: #555;
      }

      .forgot-password a {
          color: #e4032c;
          text-decoration: none;
          font-weight: 600;
      }

      .forgot-password a:hover {
          text-decoration: underline;
      }

      .register-illustration {
          display: none;
      }

      @keyframes nd-fade-up {
          from { opacity: 0; transform: translateY(16px); }
          to { opacity: 1; transform: translateY(0); }
      }

      .nd-back-home {
          position: fixed;
          top: 20px;
          left: 20px;
          text-decoration: none;
          color: #161616;
          font-weight: 600;
          font-size: 14px;
          z-index: 5;
      }

      .nd-back-home:hover {
          color: #e4032c;
      }

      @media (min-width: 750px) {
          .register-illustration {
              display: block;
          }
      }
    </style>
    <link rel="stylesheet" href="CSS/common.css" />
</head>
<body>
    <a class="nd-back-home" href="index.html">← Kembali ke Beranda</a>
    <div class="login-container">
        <img class="register-illustration" src="images/20241208_211754.png" style="height: 380px;width: 380px;" alt="Ilustrasi daftar">
        <div class="login-form">
            <form id="register-form" action="#" method="post">
                <h2>DAFTAR</h2>
                <div class="form-message" id="register-message"></div>
                <div class="input-group">
                    <label for="fullname">Nama lengkap</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="username">Nama pengguna</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <div class="input-group">
                    <label for="date">Tanggal lahir</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <button type="submit" class="btn">Daftar</button>
            </form>
            <p class="forgot-password"><a href="sign in.html">Sudah punya akun? Masuk di sini</a></p>
        </div>
    </div>

    <script src="JS/cart.js"></script>
    <script>
        (function () {
            var form = document.getElementById("register-form");
            var messageBox = document.getElementById("register-message");

            function showMessage(text, type) {
                messageBox.textContent = text;
                messageBox.className = "form-message nd-show nd-" + type;
            }

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                var data = {
                    fullname: document.getElementById("fullname").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    username: document.getElementById("username").value.trim(),
                    password: document.getElementById("password").value,
                    birthdate: document.getElementById("date").value
                };

                var result = window.ndRegisterUser(data);
                if (result.success) {
                    showMessage(result.message, "success");
                    setTimeout(function () {
                        window.location.href = "index.html";
                    }, 900);
                } else {
                    showMessage(result.message, "error");
                }
            });
        })();
    </script>
</body>
</html>
