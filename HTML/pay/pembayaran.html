<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pembayaran</title>
    <style>
        /* styles.css */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}

.product-container, .payment-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    background-color: white;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.product-container h1, .payment-container h1 {
    text-align: center;
    color: #333;
}

.product {
    text-align: center;
}

.product-image {
    width: 300px;
    height: auto;
}

button {
    background-color: #4CAF50;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #45a049;
}

form {
    margin-top: 20px;
}

label {
    display: block;
    margin-bottom: 5px;
    color: #333;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

textarea {
    resize: vertical;
    height: 100px;
}

button[type="submit"] {
    width: 100%;
    background-color: red;
}

button[type="submit"]:hover {
    background-color: rgba(255, 0, 0, 0.842);
}

    </style>
</head>
<body>
    <div class="payment-container">
        <h1>Halaman Pembayaran</h1>
        
        <div class="product-info">
            <h2>Produk yang Anda Beli:</h2>
            <img id="payment-product-image" src="../../images/nendoroid-jinx-arcane-ver-league-of-legends.jpg" alt="Produk" class="product-image">
            <p >Nendoroid Jinx Arcane Ver.</p>
            <p id="payment-product-price">Rp 820.000</p>
        </div>

        <form id="payment-form">
            <label for="name">Nama Pembeli:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Nomor Telepon:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="address">Alamat Pengiriman:</label>
            <textarea id="address" name="address" required></textarea>

            <label for="payment-method">Metode Pembayaran:</label>
            <select id="payment-method" name="payment-method" required>
                <option value="transfer">Transfer Bank</option>
                <option value="credit-card">Kartu Kredit</option>
                <option value="e-wallet">E-wallet</option>
            </select>

            <button type="submit">Bayar Sekarang</button>
        </form>
    </div>

    <script>
        // Ambil data produk dari sessionStorage dan tampilkan di halaman pembayaran
        document.addEventListener('DOMContentLoaded', function () {
            const productName = sessionStorage.getItem('productName');
            const productPrice = sessionStorage.getItem('productPrice');
            const productImage = sessionStorage.getItem('productImage');

            document.getElementById('payment-product-name').innerText = productName;
            document.getElementById('payment-product-price').innerText = productPrice;
            document.getElementById('payment-product-image').src = productImage;
        });

        // Proses pembayaran
        document.getElementById('payment-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Menghentikan form dari reload halaman
            
            // Ambil data dari form
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const paymentMethod = document.getElementById('payment-method').value;

            // Tampilkan konfirmasi pembayaran
            alert('Pembayaran berhasil! \nNama: ' + name + '\nTelepon: ' + phone + '\nAlamat: ' + address + '\nMetode Pembayaran: ' + paymentMethod);
        });
    </script>
</body>
</html>
